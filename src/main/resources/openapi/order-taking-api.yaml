openapi: 3.0.3
info:
  title: Order Taking API
  version: 1.0.0
  description: API contract for order taking endpoints and auth demo endpoints.
servers:
  - url: /
security:
  - bearerAuth: []

tags:
  - name: Public
  - name: Greeting
  - name: Orders

paths:
  /api/ping:
    get:
      operationId: ping
      tags: [Public]
      security: []
      summary: Public health ping
      responses:
        '200':
          description: Service is available
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'

  /helloGuest:
    get:
      operationId: helloGuest
      tags: [Public]
      security: []
      summary: Public hello endpoint
      responses:
        '200':
          description: Public greeting
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'

  /helloUser:
    get:
      operationId: helloUser
      tags: [Greeting]
      summary: Greeting for USER and ADMIN roles
      responses:
        '200':
          description: Authenticated greeting
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '401':
          description: Missing/invalid JWT
        '403':
          description: Insufficient role

  /helloAdmin:
    get:
      operationId: helloAdmin
      tags: [Greeting]
      summary: Greeting for ADMIN role
      responses:
        '200':
          description: Admin greeting
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '401':
          description: Missing/invalid JWT
        '403':
          description: Insufficient role

  /api/orders:
    post:
      operationId: createOrder
      tags: [Orders]
      summary: Create a new order
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
      responses:
        '200':
          description: Order created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateOrderResponse'
        '401':
          description: Missing/invalid JWT

  /api/orders/{orderId}:
    get:
      operationId: getOrder
      tags: [Orders]
      summary: Get an existing order by id
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Order found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '401':
          description: Missing/invalid JWT

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    StatusResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          example: ok

    MessageResponse:
      type: object
      required: [message]
      properties:
        message:
          type: string

    CreateOrderRequest:
      type: object
      required: [customerDetails, installationDetails, products]
      properties:
        customerDetails:
          $ref: '#/components/schemas/CustomerDetails'
        installationDetails:
          $ref: '#/components/schemas/InstallationDetails'
        products:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/ProductDetails'

    CustomerDetails:
      type: object
      required: [name, phone]
      properties:
        name:
          type: string
        phone:
          type: string
          pattern: '^\\d{8}$'

    InstallationDetails:
      type: object
      required: [address, preferredDateTime, timeSlot]
      properties:
        address:
          type: string
        preferredDateTime:
          type: string
          format: date-time
        timeSlot:
          type: string

    ProductDetails:
      type: object
      required: [productType, packageType]
      properties:
        productType:
          $ref: '#/components/schemas/ProductType'
        packageType:
          $ref: '#/components/schemas/PackageType'

    ProductType:
      type: string
      enum: [INTERNET, TV, TELEPHONY, MOBILE]

    PackageType:
      type: string
      enum:
        - INTERNET_250_MBPS
        - INTERNET_1_GBPS
        - TV_90_CHANNELS
        - TV_140_CHANNELS
        - FREE_ON_NET_CALLS
        - UNLIMITED_CALLS
        - MOBILE_PREPAID
        - MOBILE_POSTPAID

    CreateOrderResponse:
      type: object
      required: [orderDetails]
      properties:
        orderDetails:
          $ref: '#/components/schemas/Order'

    Order:
      type: object
      properties:
        id:
          type: string
        customerDetails:
          type: string
        installationAddress:
          type: string
        preferredInstallationDate:
          type: string
        timeSlotDetails:
          type: string
        requiredProducts:
          type: string
        requiredPackage:
          type: string

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: backend-java-app
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/game_backend
      SPRING_DATASOURCE_USERNAME: game_backend
      SPRING_DATASOURCE_PASSWORD: game_backend
      KEYCLOAK_ISSUER_URI: http://keycloak:8080/realms/backend-java
      KEYCLOAK_CLIENT_ID: game-backend
      KEYCLOAK_REQUIRED_AUDIENCE: game-backend
      KEYCLOAK_ALLOWED_AUTHORIZED_PARTIES: game-backend-cli

  postgres:
    image: postgres:16-alpine
    container_name: game-backend-postgres
    environment:
      POSTGRES_DB: game_backend
      POSTGRES_USER: game_backend
      POSTGRES_PASSWORD: game_backend
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U game_backend -d game_backend"]
      interval: 10s
      timeout: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.5.1
    container_name: keycloak
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
    ports:
      - "8090:8080"
    command: start-dev --http-port=8080 --import-realm
    volumes:
      - ./docker/keycloak/realm-import:/opt/keycloak/data/import:ro
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/8080'"]
      interval: 10s
      timeout: 5s
      retries: 20

spring:
  application:
    name: game-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/game_backend}
    username: ${SPRING_DATASOURCE_USERNAME:game_backend}
    password: ${SPRING_DATASOURCE_PASSWORD:game_backend}
    hikari:
      pool-name: game-backend-pool
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8090/realms/backend-java}
  flyway:
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

# Logging
logging:
  level:
    root: info
    org:
      springframework:
        security: info
        web: info
        boot: info

app:
  security:
    keycloak:
      client-id: ${KEYCLOAK_CLIENT_ID:game-backend}
      required-audience: ${KEYCLOAK_REQUIRED_AUDIENCE:game-backend}
      allowed-authorized-parties: ${KEYCLOAK_ALLOWED_AUTHORIZED_PARTIES:game-backend-cli}
      principal-claim: ${KEYCLOAK_PRINCIPAL_CLAIM:preferred_username}
  gameplay:
    session:
      token-ttl: ${GAMEPLAY_SESSION_TOKEN_TTL:PT5M}
      websocket-path: ${GAMEPLAY_WEBSOCKET_PATH:/ws/gameplay}
    movement:
      speed-units-per-second: ${GAMEPLAY_MOVEMENT_SPEED_UNITS_PER_SECOND:4.0}
      default-zone-id: ${GAMEPLAY_DEFAULT_ZONE_ID:starter-zone}
